<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabby — la barra in tutti i suoi stati</title>
<!--
  Componenti, 3.7 (8/11/2026): la barra di Tabby in tutti i suoi stati, coi mattoni decisi
  (temi, SF Pro, SF Symbols scelti, angoli morbidi: barra 14, scheda 9; compatto: barra 38,
  scheda 28; animazioni elastiche; niente riga tra batteria e tasti).
  Le proposte di pulizia sono segnate «PROPOSTA».
-->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #ECECEF; color: #1D1D1F; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; } .lead { margin: 0 0 12px; color: #6E6E73; max-width: 880px; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; align-items: center; } .ctl .lbl { color: #6E6E73; min-width: 74px; }
.ctl button { border: 0; border-radius: 999px; padding: 5px 11px; font: inherit; background: rgba(0,0,0,.07); cursor: pointer; } .ctl button.on { background: #0A84FF; color: #fff; }
h2 { font-size: 15px; margin: 26px 0 4px; }
.st { margin: 12px 0 0; }
.st .lb { display: flex; gap: 8px; align-items: baseline; margin-bottom: 5px; } .st .lb b { font-size: 13px; } .st .lb span { color: #6E6E73; font-size: 12px; }
.prop { display: inline-block; font-size: 10.5px; font-weight: 700; color: #9A5A00; background: #FFF1D6; border-radius: 5px; padding: 0 6px; letter-spacing: .03em; }
.desk { position: relative; border-radius: 12px; overflow: hidden; background: radial-gradient(ellipse at 25% 20%, #4E7FAE, #22405F 55%, #111D2B); padding-bottom: 26px; }
.desk.light { background: radial-gradient(ellipse at 25% 20%, #9FC3E6, #6F98C2 55%, #4C719B); }
.sym { display: inline-block; flex: none; width: 15px; height: 15px; background-color: currentColor; -webkit-mask: var(--u) center/contain no-repeat; mask: var(--u) center/contain no-repeat; }
/* la barra */
.bar { height: 38px; display: flex; align-items: center; gap: 1px; padding: 0 2px; color: var(--text); background: var(--bar); border-radius: 0 0 14px 14px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--barLine); position: relative; }
.cat { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 9px; }
.cat svg { width: 20px; height: 20px; fill: var(--cat); }
.cat.desk-on { background: var(--hover); } .cat.desk-on svg { fill: var(--accent); filter: drop-shadow(0 0 4px var(--glow)); }
.tab { position: relative; height: 28px; padding: 0 8px; border-radius: 9px; display: flex; align-items: center; gap: 7px; color: var(--sub); font-size: 12.5px; white-space: nowrap; flex: none; cursor: default; max-width: 190px;
  transition: color .2s, background .12s; }
.tab .nm { overflow: hidden; text-overflow: ellipsis; }
.tab:hover, .tab.hov { background: var(--hover); color: var(--text); }
.tab.on { background: var(--fill); color: var(--on); font-weight: 600; box-shadow: var(--fillShadow); }
.tab.on:hover { background: var(--fill); color: var(--on); }
.ic { width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9px; font-weight: 700; flex: none; }
.cl { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; opacity: .55; margin-left: 2px; flex: none; }
.cl .sym { width: 12px; height: 12px; }
.badge { min-width: 16px; height: 15px; padding: 0 4px; border-radius: 8px; background: #FF453A; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #FF453A; position: absolute; right: 3px; top: 3px; box-shadow: 0 0 0 1.5px var(--barSolid); }
.min .ic { opacity: .45; } .min .nm { opacity: .7; font-style: italic; }
.tab.comp { padding: 0 6px; }
.more { height: 28px; padding: 0 8px; border-radius: 9px; display: flex; align-items: center; color: var(--sub); font-size: 12px; }
.plus { width: 30px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 9px; flex: none; }
.plus:hover { background: var(--hover); color: var(--text); }
.stack { display: flex; } .stack .ic { margin-left: -5px; box-shadow: 0 0 0 1.5px var(--barSolid); } .stack .ic:first-child { margin-left: 0; }
.cnt { min-width: 15px; height: 14px; padding: 0 3px; border-radius: 4px; background: var(--hover); color: var(--text); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tab.on .cnt { background: rgba(0,0,0,.16); color: var(--on); }
.act { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 5px; opacity: .65; }
.act .sym { width: 12px; height: 12px; }
.pick { box-shadow: 0 0 0 1.5px var(--accent), 0 0 10px var(--glow); }
.tab.on.pick { box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 3px rgba(0,0,0,.5); }
.ok { position: absolute; right: -4px; top: -4px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px var(--barSolid); }
.ok .sym { width: 9px; height: 9px; color: var(--on2); }
.drop { width: 2px; height: 20px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 6px var(--glow); flex: none; margin: 0 -1px; }
.ghost { position: absolute; left: 330px; top: 30px; z-index: 3; height: 28px; padding: 0 9px; border-radius: 9px; display: flex; align-items: center; gap: 7px; font-size: 12.5px;
  background: var(--panel); color: var(--text); box-shadow: 0 0 0 .5px var(--line), 0 10px 26px rgba(0,0,0,.45); transform: rotate(-2deg); }
.ren input { font: inherit; font-weight: 600; color: inherit; background: rgba(255,255,255,.35); border: 0; outline: 0; border-radius: 5px; padding: 1px 5px; width: 120px; box-shadow: 0 0 0 2px var(--accent); }
.sp { flex: 1; }
.bat { display: flex; align-items: center; justify-content: center; width: 34px; height: 38px; color: var(--sub); }
.bat .sym { width: 21px; height: 13px; } .bat.low { color: #FF6B5E; } .bat.full { color: #34C27A; }
.timer { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 54px; height: 38px; gap: 3px; }
.timer b { font-size: 11.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.timer i { width: 36px; height: 3px; border-radius: 2px; background: var(--hover); overflow: hidden; } .timer i u { display: block; height: 100%; width: 62%; background: var(--fill); }
.bb { width: 34px; height: 38px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 9px; flex: none; }
.bb:hover { color: var(--text); } .bb.hot { color: var(--accent); } .bb.lit { background: var(--hover); color: var(--accent); }
.wide { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 6px; border-radius: 9px; background: var(--hover); color: var(--accent); }
.wide .ic { width: 18px; height: 18px; }
.wide small { color: var(--text); font-size: 11.5px; margin-left: 2px; }
.fhead { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; color: var(--text); font-size: 13px; border-radius: 9px; }
.fhead .back { color: var(--sub); padding: 0 4px; } .fhead .sym { color: var(--accent); }
.notch { width: 190px; height: 38px; flex: none; background: #000; border-radius: 0 0 12px 12px; margin: 0 6px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.25); font-size: 10px; }
/* di lato */
.sidewrap { display: flex; justify-content: flex-end; height: 420px; padding: 0; }
.vbar { width: 168px; height: 100%; display: flex; flex-direction: column; color: var(--text); background: var(--bar); border-radius: 14px 0 0 14px; padding: 6px 0; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.vbar .bigcat { height: 74px; display: flex; align-items: center; justify-content: center; }
.vbar .bigcat svg { width: 46px; height: 46px; fill: var(--cat); }
.vbar .tab { margin: 1px 6px; max-width: none; }
.vbar .tab .cl { margin-left: auto; }
.vbar .foot { margin-top: auto; display: flex; flex-direction: column; align-items: stretch; }
.vbar .foot .row { display: flex; justify-content: space-around; }
.note { margin-top: 6px; color: #3A3A3C; font-size: 12.5px; }
.note ul { margin: 4px 0 0; padding-left: 18px; } .note li { margin: 2px 0; }
</style></head><body><div class="wrap">

    ['Trascinata', 'Una scheda "fantasma" sotto il puntatore e la lineetta del tema dove cadrà.', CATB() + T('S', {on: 1, x: 1}) + T('N', X) + '<div class="drop"></div>' + T('M', X) + T('C', X) + PLUS() + RIGHT() + '<div class="ghost">' + IC('W') + 'Windows App</div>'],
    ['Rinominata sul posto', 'Si scrive sulla scheda (deciso con le domande).', CATB() + T('S', {x: 1}) + T('M', {on: 1, ren: 1}) + T('N', X) + PLUS() + RIGHT()]
  ]],
  ['Il resto della barra', [
    ['Il gatto sulla Scrivania', 'Con ⌃⌥0 o senza finestre: il gatto si accende nel colore del tema.', CATB({desk: 1}) + T('S', X) + T('N', X) + PLUS() + RIGHT()],
    ['Batteria', 'Solo l\'icona (percentuale al passaggio del mouse): verde da 80%, rossa sotto il 35%, il fulmine in carica.', CATB() + T('S', {on: 1, x: 1}) + PLUS() + '<div class="sp"></div><div class="bat full">' + S('battery.100percent.bolt') + '</div><div class="bat low">' + S('battery.75percent') + '</div><div class="bat">' + S('battery.75percent') + '</div><div class="bb">' + S('rectangle.grid.2x2') + '</div><div class="bb hot">' + S('sparkles') + '</div><div class="bb">' + S('slider.horizontal.3') + '</div>'],
    ['Concentrazione in corso', 'Al posto della batteria il tempo che manca, con una barretta che si riempie nel colore del tema.', CATB() + T('N', {on: 1, x: 1}) + T('D', X) + PLUS() + RIGHT({timer: 1})],
    ['Lampi coperti', 'Il tasto dei Lampi si allarga con le loro icone e «Tutti» (un solo tasto, v9.48).', CATB() + T('S', {on: 1, x: 1}) + T('N', X) + PLUS() + RIGHT({wide: 1})],
    ['Mentre dividi lo schermo', 'Il tasto ⊞ resta acceso.', CATB() + T('S', {on: 1, x: 1}) + T('N', X) + PLUS() + RIGHT({split: 1})],
    ['Vista cartella', 'A sinistra «←» per tornare a tutte e il nome della cartella col suo menu; poi solo le sue schede.', CATB() + '<div class="fhead"><span class="back">←</span>' + S('square.stack.3d.up') + '<b>Lavoro</b> ▾</div>' + T('S', {on: 1, x: 1}) + T('N', X) + T('M', X) + PLUS() + RIGHT()],
    ['Il notch (MacBook)', 'Le schede saltano lo spazio della fotocamera.', CATB() + T('S', {on: 1, x: 1}) + T('N', X) + '<div class="notch">notch</div>' + T('M', X) + T('C', X) + PLUS() + RIGHT()],
    ['Niente righe divisorie', 'PROPOSTA: togliere anche la riga dopo il gatto (oggi c\'è): solo spazio, come in macOS. Quella tra batteria e tasti è già tolta.', CATB() + T('S', {on: 1, x: 1}) + T('N', X) + T('M', X) + PLUS() + RIGHT(), 0, 1]
  ]]
];
function side() {
  return '<div class="desk' + (TH[theme].light ? ' light' : '') + ' sidewrap"><div class="vbar"><div class="bigcat">' + CAT + '</div>' +
    T('S', {badge: '3'}) + T('N', {on: 1, x: 1}) + T('M', {}) + '<div class="tab"><span class="stack">' + IC('C') + IC('W') + '</span><span class="nm">Daily</span><span class="cnt">2</span></div>' + T('D', {min: 1, name: 'Contratto'}) +
    '<div class="plus" style="margin:2px 6px;width:auto;justify-content:flex-start;padding-left:8px">' + S('plus.app') + '</div>' +
    '<div class="foot"><div class="bat" style="width:auto">' + S('battery.75percent') + '</div><div class="row"><div class="bb">' + S('rectangle.grid.2x2') + '</div><div class="bb hot">' + S('sparkles') + '</div><div class="bb">' + S('slider.horizontal.3') + '</div></div></div></div></div>';
}
function render() {
  var t = TH[theme], out = document.getElementById('out'), h = '';
  STATES.forEach(function (g) {
    h += '<h2>' + g[0] + '</h2>';
    g[1].forEach(function (s, i) { h += '<div class="st"><div class="lb"><b>' + s[0] + '</b>' + (s[4] ? '<span class="prop">PROPOSTA</span>' : '') + '<span>' + s[1] + '</span></div>' + BAR(s[2]) + '</div>'; });
  });
  h += '<h2>Tabby di lato (a destra)</h2><div class="st"><div class="lb"><b>Colonna</b><span>In cima il gatto intero; le schede in righe col nome; in fondo batteria e tasti. Stessi stati di sopra.</span></div>' + side() + '</div>';
  h += '<div class="note"><b>Decise da Daniele (8/11/2026):</b><ul><li>Finestra ridotta: icona e nome attenuati.</li><li>La ✕ solo sulla scheda attiva e sotto il mouse.</li><li>Niente riga dopo il gatto.</li></ul></div>';
  out.innerHTML = h;
  for (var k in t) out.style.setProperty('--' + k, t[k]);
  document.getElementById('themes').innerHTML = '<span class="lbl">Tema:</span>' + Object.keys(TH).map(function (n) { return '<button class="' + (n === theme ? 'on' : '') + '">' + n + '</button>'; }).join('');
}
document.getElementById('themes').onclick = function (e) { if (e.target.tagName === 'BUTTON') { theme = e.target.textContent; render(); } };
// la prima riga: clic per cambiare scheda (il riempimento cambia con l'animazione)
document.getElementById('out').addEventListener('click', function (e) {
  var tb = e.target.closest('.tab'); if (!tb) return; var bar = tb.parentNode; if (bar.querySelector('.ren') || bar.querySelector('.pick')) return;
  bar.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); }); tb.classList.add('on');
});
render();
</script></body></html>
